# Claude-powered review of Dependabot PRs, with auto-merge of safe patch/minor bumps.
#
# On every Dependabot PR, a Claude Code session reviews the dependency change (diff, release
# notes, how the dependency is used in this codebase). Clean semver-patch/minor bumps get an
# approving review and `gh pr merge --auto`, so the PR merges on its own once the required
# checks (CI, CodeQL, dependency-review) pass. Major bumps, mixed-update PRs, or anything
# suspicious get a summarizing comment for human review instead — never a merge.
#
# Security model — plain `pull_request` + the Dependabot secrets store:
# - Workflows triggered by Dependabot resolve `secrets.*` from the *Dependabot* secrets store
#   (Settings > Secrets and variables > Dependabot), and GitHub hands those secrets ONLY to
#   runs actually triggered by Dependabot. A human's PR, a fork PR, or a push to this workflow
#   file never sees the key — fork PRs receive no secrets at all, and non-Dependabot actors
#   don't get Dependabot secrets. That closes the "modify the workflow to leak the secret"
#   route without needing `pull_request_target` at all.
# - The job additionally runs only for PRs authored by dependabot[bot], and Claude's toolset
#   is allowlisted to a few read/review/merge `gh pr` subcommands plus read-only file access:
#   it cannot edit files, run builds, or push.
# - GITHUB_TOKEN is read-only by default on Dependabot-triggered runs; the job-level
#   `permissions` block below explicitly raises it to what merging needs.
#
# Setup requirements (one-time):
# - Secret ANTHROPIC_API_KEY under Settings > Secrets and variables > *Dependabot* (NOT the
#   Actions store — this workflow only ever runs for Dependabot, which reads the Dependabot
#   store). Prefer a key from a dedicated Anthropic workspace with a spend limit. Or swap in
#   CLAUDE_CODE_OAUTH_TOKEN below.
# - The Claude GitHub App installed on the repo (provides Claude's GitHub token via OIDC).
# - Settings > General > "Allow auto-merge" enabled, plus branch protection on main with the
#   required status checks — that is what `gh pr merge --auto` waits on. Without it, Claude
#   falls back to approve + comment and a human presses the merge button.
name: Dependabot auto-review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge
      pull-requests: write # approve / comment / enable auto-merge
      id-token: write # OIDC exchange for the Claude GitHub App token
    steps:
      # Default checkout = the PR merge ref (base + Dependabot's bump), so Claude sees the
      # project as it would look after the update. Safe here: the job only runs for
      # Dependabot-authored PRs and Claude has no build/execute tools anyway.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Deterministic semver classification (semver-patch / semver-minor / semver-major),
      # straight from Dependabot's own metadata rather than parsed out of the PR title.
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        id: metadata

      - uses: anthropics/claude-code-action@e63208cb983318a44e3f945e959ef894b707dcfa # v1.0.192
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude Pro/Max subscription alternative to the API key:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot]" # the action rejects bot-triggered runs by default
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
            UPDATE TYPE: ${{ steps.metadata.outputs.update-type }}

            You are reviewing an automated dependency-update PR opened by Dependabot. The
            workspace contains the PR merge ref (the project with the bump applied). Inspect
            the change itself with `gh pr view` and `gh pr diff`.

            1. Review the diff. It must be a pure version bump: only pom.xml files and/or
               GitHub Actions pins in workflow files (SHA plus version comment) may change, and
               every change must match the dependencies and versions announced above. Anything
               else is a red flag.
            2. Assess impact: check how the updated dependencies are used in this codebase (the
               workspace) and read the release notes/changelog in the PR body for breaking or
               behavioral changes that could affect this project.
            3. Decide:
               - MERGE PATH — only if the update type is version-update:semver-patch or
                 version-update:semver-minor, the diff is a clean pure bump, and you found no
                 breaking/behavioral concern: approve with
                 `gh pr review --approve --body "<short review summary>"`, then run
                 `gh pr merge --auto --squash` so the PR merges only after required checks
                 pass (use `--merge` if squash merging is rejected as not allowed). If
                 auto-merge cannot be enabled on this repository, do not wait for checks:
                 leave the approval and post a comment saying the bump is safe to merge once
                 CI is green.
               - REVIEW-ONLY PATH — for version-update:semver-major, PRs mixing update types,
                 any unexpected content in the diff, or plausible breaking changes: do NOT
                 approve or merge. Post one `gh pr comment` summarizing what the update
                 changes, your concern, and what a human should verify before merging.
            4. Hard rules: never modify files, never push commits, never merge over failing
               checks, and never merge outside the conditions above. If a gh command fails,
               report the failure in a PR comment instead of working around it.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr comment:*),Read,Glob,Grep"
            --max-turns 30
