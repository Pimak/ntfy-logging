name: Docs

# https://pimak.github.io/ntfy-logging/ — MkDocs Material, versioned with mike on gh-pages.
# One entry per MINOR version: a patch tag overwrites its minor, so only the last patch of each
# survives. `dev` tracks main, `latest` aliases the newest release, the root redirects there.
# No `paths:` filters: the site embeds the Javadoc, so a source-only change alters it too.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      task:
        description: Which maintenance task to run
        type: choice
        options: [republish, set-default, squash-history]
        default: republish
      version:
        description: 'republish / set-default - the version to act on (e.g. 2.0, latest, dev)'
        type: string
        default: ''
      ref:
        description: 'republish only - the git ref to build it from (tag or branch)'
        type: string
        default: ''
      force:
        description: 'set-default only - point the root at superseded docs anyway'
        type: boolean
        default: false
  schedule:
    - cron: '0 5 1 * *'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # python3: runs before the composite sets up a Python, and fail-fast beats waiting on Javadoc.
      - name: Check README and site landing page agree on the guide list
        run: python3 .github/scripts/check-docs-sync.py

      - uses: ./.github/actions/build-docs

      - name: Build the site (strict)
        run: mkdocs build --strict

      # --strict is blind to this: an unrendered shortcode is ordinary text, not a broken link, so
      # the build stays green while the page shows ":material-arrow-right:". That shipped once.
      - name: Check no icon shortcode was left unrendered
        run: |
          set -euo pipefail
          if grep -rlE ':(material|fontawesome|octicons)-[a-z0-9-]+:' site --include='*.html' \
               --exclude-dir=search --exclude-dir=apidocs; then
            echo "::error::The pages above render an icon shortcode as literal text. Enable the"
            echo "::error::matching extension in mkdocs.yml, or drop the shortcode."
            exit 1
          fi
          echo "No unrendered icon shortcodes."

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shared by every job writing to gh-pages, and never cancelled: concurrent mike deploys corrupt
    # each other, and a cancelled one leaves the branch half-written.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-docs

      - name: Deploy the dev version
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Without the remote branch locally, mike starts a divergent one and the push is rejected.
          git fetch origin gh-pages || echo "gh-pages does not exist yet - mike will create it"
          mike deploy --push dev

          # Bootstrap only: an unset root 404s. An existing one is left alone, forced or not.
          if git show gh-pages:index.html > /dev/null 2>&1; then
            echo "The site root already points somewhere - leaving it alone."
          else
            echo "No site root redirect yet - pointing it at dev until the first release."
            mike set-default --push dev
          fi

  deploy-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Actions tag filters are globs, not regexes: `v*.*.*` still matches v2.1.0-RC1, which would
      # publish a release candidate as the 2.1 docs and drag `latest` onto it.
      - name: Identify the release
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$TAG is not a stable release tag - the docs site is left untouched."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MINOR="${TAG#v}"
          MINOR="${MINOR%.*}"
          echo "stable=true"  >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "Deploying docs for $TAG as version $MINOR"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.tag.outputs.stable == 'true'
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-docs
        if: steps.tag.outputs.stable == 'true'

      - name: Deploy the release version
        if: steps.tag.outputs.stable == 'true'
        env:
          MINOR: ${{ steps.tag.outputs.minor }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || echo "gh-pages does not exist yet - mike will create it"

          # A backport must not drag `latest` or the root backwards: v2.0.2 released while 2.1 is
          # out refreshes the 2.0 pages only.
          HIGHEST=$(mike list 2>/dev/null | awk '{print $1}' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          NEWEST=$(printf '%s\n%s\n' "${HIGHEST:-0.0}" "$MINOR" | sort -V | tail -1)
          if [ -z "$HIGHEST" ] || [ "$NEWEST" = "$MINOR" ]; then
            echo "$MINOR is the newest minor (previous highest: ${HIGHEST:-none}) - moving the latest alias and the site root."
            mike deploy --update-aliases "$MINOR" latest
            mike set-default latest
            # One push: no window where the alias has moved and the root has not.
            git push origin gh-pages
          else
            echo "::notice::$MINOR is a backport behind $HIGHEST - deploying it WITHOUT moving latest or the site root."
            mike deploy --push "$MINOR"
          fi

  # Fixes an already-released version's docs without cutting a patch, since main only writes `dev`.
  republish:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'republish'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Validate the inputs
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::'version' is required (e.g. 2.0)"; exit 1; }
          test -n "$REF"     || { echo "::error::'ref' is required (the tag or branch to build)"; exit 1; }
          printf '%s' "$VERSION" | grep -qE '^([0-9]+\.[0-9]+|dev)$' \
            || { echo "::error::'version' must be a MINOR version like 2.0, or 'dev'"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/build-docs

      - name: Republish that version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          # No --update-aliases: refreshing content must never move `latest`.
          mike deploy --push "$VERSION"
          echo "Republished $VERSION from $REF"

  # Recovery only — releases move the root on their own. mike set-default accepts a superseded
  # version silently, hence the guard.
  set-default:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'set-default'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Not the build-docs composite: a root redirect rewrites no page, so nothing needs building.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the MkDocs toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Point the site root at that version
        env:
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::'version' is required (e.g. latest, or dev at bootstrap)"; exit 1; }
          # Shape, not an allow-list, so a future alias needs no change here: quoting stops
          # word-splitting but not option parsing, so a leading '-' would still read as a flag.
          printf '%s' "$VERSION" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$' \
            || { echo "::error::'version' must start with a letter or digit and contain only letters, digits, dot, underscore or hyphen (got '$VERSION')"; exit 1; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages \
            || { echo "::error::There is no gh-pages branch yet — push to main once to publish the site before setting its root."; exit 1; }

          FLAGS=""
          if [ "$FORCE" = "true" ]; then FLAGS="--force"; fi
          mike list -j | python .github/scripts/check-default-version.py "$VERSION" $FLAGS

          mike set-default --push "$VERSION"
          echo "The site root now redirects to $VERSION."

  # Every deploy commits regenerated files and git never reclaims past blobs, so the branch only
  # grows and a clone pulls all of it. Safe to squash here, unlike main: the content is regenerable.
  squash-history:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task == 'squash-history')
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Squash gh-pages to a single commit
        run: |
          set -euo pipefail
          # versions.json drives the version selector; force-pushing without it empties the site.
          test -f versions.json || { echo "::error::versions.json is missing - refusing to squash."; exit 1; }
          echo "Currently published:"
          cat versions.json
          BEFORE=$(git rev-list --count HEAD)
          if [ "$BEFORE" -le 1 ]; then
            echo "gh-pages already has $BEFORE commit - nothing to squash."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan squashed-gh-pages
          git add -A
          git commit -m "docs: squash gh-pages history"
          git branch -M gh-pages
          git push --force origin gh-pages
          echo "gh-pages history: $BEFORE commits -> 1 (tree unchanged)"
