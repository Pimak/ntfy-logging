name: Temporary secret transfer

on:
  push:
    paths:
      - .github/workflows/codex-transfer-secrets.yml

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer release secrets
        env:
          GH_TOKEN: ${{ secrets.CODEX_TRANSFER_TOKEN }}
          SOURCE_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          SOURCE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          SOURCE_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SOURCE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_USERNAME" | gh secret set MAVEN_CENTRAL_TOKEN_USERNAME --repo Pimak/hanab-client
          printf '%s' "$SOURCE_PASSWORD" | gh secret set MAVEN_CENTRAL_TOKEN_PASSWORD --repo Pimak/hanab-client
          printf '%s' "$SOURCE_GPG_KEY" | gh secret set GPG_PRIVATE_KEY --repo Pimak/hanab-client
          printf '%s' "$SOURCE_GPG_PASSPHRASE" | gh secret set GPG_PASSPHRASE --repo Pimak/hanab-client