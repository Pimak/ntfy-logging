# English base bundle for AlertMessages -- the source of truth AND the fallback for every locale.
#
# TWO KINDS OF KEYS:
#   * No-placeholder keys (labels + fixed status/warning strings) are returned VERBATIM by
#     AlertMessages.get(key) and are NEVER run through MessageFormat. They must contain no '{'
#     placeholder in any locale (a bundle-invariant test enforces this), which is exactly what
#     structurally guarantees a token/username/password can never be interpolated into them.
#     Literal single quotes are fine here (they are not MessageFormat patterns).
#   * MessageFormat pattern keys (the 5 composers + the window-description keys) ARE parsed by
#     java.text.MessageFormat, so every LITERAL single quote must be DOUBLED (''), and every
#     numeric argument is passed pre-formatted via String.valueOf(...) so no locale digit-grouping
#     is ever applied (English output stays byte-for-byte identical to the old hand-built strings).
#
# This file is UTF-8. Java 9+ loads .properties resource bundles as UTF-8, and the build declares
# project.build.sourceEncoding=UTF-8 with no resource filtering, so the em dash (—, U+2014) below is
# safe to store literally. When contributing a translation keep the file UTF-8 (or use \uXXXX
# escapes) and never let an editor re-save it as ISO-8859-1.

# --- Body labels (no placeholders; trailing space preserved via  ) ---
label.message=Message: 
label.logger=Logger: 
label.cause=Caused by: 
label.timestamp=Time: 

# --- Fixed, credential-safe status/warning strings (no placeholders) ---
status.disabledUnconfigured=ntfy alert engine not configured (url/topic unset) — inactive
status.disabledPartialConfig=url set but topic missing — engine disabled
status.tokenAndBasicBothSet=both token and username/password configured — token takes precedence
status.incompleteBasicAuth=username or password set but not both — basic auth is incomplete; publishing WITHOUT an Authorization header
status.credentialsOverPlainHttp=credentials configured with a plain http:// URL — the token/password and alert content are sent unencrypted; use https://
status.credentialsOverPlainHttpRefused=credentials configured with a plain http:// URL and require-https-for-credentials is enabled — refusing to send credentials unencrypted; use https:// — engine disabled
status.invalidTopic=topic is not a valid ntfy topic name (allowed: A-Z, a-z, 0-9, '-', '_'; max 64 chars) — engine disabled
status.invalidUrl=url is not a valid http(s) endpoint (expected http:// or https:// with a host) — engine disabled
status.invalidPriorityOrTags=configured priority/tags value contains non-printable-ASCII characters — the invalid header will be omitted from publishes
status.invalidWarnTopic=warn-topic is not a valid ntfy topic name (allowed: A-Z, a-z, 0-9, '-', '_'; max 64 chars) — WARN routing disabled, ERROR alerting unaffected
status.warnTopicFromClasspathRefused=warn-topic comes ONLY from a classpath ntfy.properties (no NTFY_WARN_TOPIC env var or ntfy.warn-topic system property set) — refusing to route WARN for supply-chain safety; ERROR alerting unaffected. If that file is yours and you trust it, opt in with -Dntfy.allow-classpath-endpoint=true or NTFY_ALLOW_CLASSPATH_ENDPOINT=true
status.invalidSuppressionWindow=suppressionWindow must be positive — falling back to default (3 minutes)
status.invalidConnectTimeout=connectTimeout must be positive — falling back to default (5 seconds)
status.invalidRequestTimeout=requestTimeout must be positive — falling back to default (10 seconds)
status.invalidAsyncQueueCapacity=asyncQueueCapacity must be positive — falling back to the minimum (1)
status.asyncQueueOverflow=ntfy async delivery queue is full — dropped alerts are folded into the storm digest
publish.unexpectedError=ntfy publish threw unexpectedly

# --- Startup self-test (opt-in; nothing below is ever emitted when startup-ping is off) ---
status.startupPing.probePassed=ntfy startup self-test PASSED (probe) — the server answered and accepted the credentials; note that a read-only probe cannot prove WRITE permission, so use startup-ping=publish to verify alerts are actually deliverable
status.startupPing.publishPassed=ntfy startup self-test PASSED (publish) — a test notification was accepted by the server, so the endpoint, credentials and topic all work
status.startupPing.failFastRefused=ntfy startup self-test failed and startup-ping-fail-fast is enabled — refusing to start
status.startupPing.failFastWithoutMode=startup-ping-fail-fast is enabled but no self-test is configured — no route will be tested, so the flag has no effect; set startup-ping (or startup-ping-warn) to probe or publish
status.startupPing.invalidMode=startup-ping is not a recognized mode (expected off, probe, or publish) — the unrecognized value is ignored
status.startupPing.warnInvalidMode=startup-ping-warn is not a recognized mode (expected off, probe, or publish) — the unrecognized value is ignored
status.startupPing.notifyFailed=ntfy startup self-test could not publish its failure notification either — the diagnostics above are the only report
selftest.title=ntfy startup self-test
selftest.failure.title=ntfy startup self-test FAILED
selftest.body=Startup self-test from the ntfy logging integration. Alerting is configured and this topic is reachable. No action required.

# --- MessageFormat pattern keys (literal single quotes MUST be doubled as '') ---
status.active=ntfy alert engine ACTIVE (url={0}, topic={1})
publish.failed.withStatus=ntfy publish failed for topic ''{0}'' (HTTP {1})
publish.failed.noStatus=ntfy publish failed for topic ''{0}''
status.exclusions.none=ntfy alert engine: no excluded loggers configured
status.exclusions.list=ntfy alert engine excluded loggers: {0}
status.includeMdcKeys.list=ntfy alert engine: MDC keys included in alert bodies: {0}
status.warnRoute=ntfy alert engine: WARN events are routed to topic ''{0}''
digest.title={0} — {1} errors suppressed
digest.title.warn={0} — {1} warnings suppressed
digest.body.summary={0} errors suppressed in the last {1}
digest.body.summary.warn={0} warnings suppressed in the last {1}
digest.body.loggerLine={0}x {1}
digest.body.overflow=+{0} others
window.minute={0} minute
window.minutes={0} minutes
window.second={0} second
window.seconds={0} seconds
selftest.title.withApp={0} — ntfy startup self-test
status.startupPing.credentialsRejected=ntfy startup self-test FAILED (HTTP {0}) — the server rejected the credentials; the token may be revoked or expired, or it may not grant access to this topic
status.startupPing.endpointNotFound=ntfy startup self-test FAILED (HTTP {0}) — no such endpoint on the server; url must be the ntfy BASE url with the topic NOT appended, and the topic must exist
status.startupPing.rateLimited=ntfy startup self-test FAILED (HTTP {0}) — the server is rate-limiting this client; the configuration itself looks correct, retry later or raise the server''s limits
status.startupPing.serverError=ntfy startup self-test FAILED (HTTP {0}) — the server reported an internal error; the configuration itself looks correct, the ntfy server is unhealthy
status.startupPing.unexpectedStatus=ntfy startup self-test FAILED (HTTP {0}) — the server rejected the request
status.startupPing.warnRoute=WARN route (topic ''{1}'') — {0}
selftest.failure.title.withApp={0} — ntfy startup self-test FAILED
selftest.failure.body=A startup self-test failed for this application''s ntfy alerting. This notification was sent through a route that still works, so the route named below is the one that is broken:\n\n{0}
status.startupPing.unreachable=ntfy startup self-test FAILED ({0}) — the ntfy server could not be reached; check url, DNS, and any egress firewall or proxy
