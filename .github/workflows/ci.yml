name: CI

on:
  # Same shape as codeql.yml and docs.yml: post-merge on main, plus every PR. An unfiltered `push`
  # ran the whole matrix twice for any branch with a PR open — once for the branch, once for the
  # PR — which on Dependabot branches meant two full reactor builds and two native compiles per
  # bump, and two independent chances to hit a flake.
  push:
    branches: [main]
  pull_request:

# The default GITHUB_TOKEN needs nothing beyond reading the repo; everything else stays denied.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast leg: the whole multi-module reactor (ntfy-core, ntfy-jul, ntfy-logback, ntfy-log4j2, the
  # Spring starter, and the Quarkus runtime/deployment + integration-tests in JVM mode) on both
  # supported JDKs.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode verify

  # Reproducibility gate. `artifact:check-buildplan` reads the resolved build plan of every module
  # and fails on anything known to make a rebuild differ from the build before it: a missing
  # <project.build.outputTimestamp>, or a plugin at a version whose output is on the plugin's
  # not-reproducible list.
  #
  # What green means here, precisely, because the honest claim is narrower than the obvious one:
  # the build plan contains nothing known to break reproducibility. It is a static check. Nothing in
  # CI builds the reactor twice and diffs the artifacts, so a plugin whose output varies without
  # being on that list would pass here — the gate protects the property, it does not measure it. To
  # measure it, build the reactor twice from a clean tree and compare the jar checksums.
  #
  # Separate job rather than a step in `build`: it needs no compile and no test run (the goal only
  # inspects the plan), so it reports in seconds instead of waiting behind the matrix, and its
  # failure reads as "the build stopped being reproducible" rather than as a build break.
  #
  # Single JDK on purpose. The build plan is the same on 21 and 25 — the property and the plugin
  # versions come from pom.xml, not from the toolchain — so a matrix here would buy two identical
  # answers.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check the build plan is reproducible
        # Prefix form: the version is pinned in the root pom's <pluginManagement> so Dependabot can
        # bump it, rather than being frozen in a coordinate here where nothing would ever move it.
        run: ./mvnw --batch-mode artifact:check-buildplan

  # Slow leg (the native smoke): GraalVM-native-compiles the Quarkus integration-tests app and runs
  # its @QuarkusIntegrationTest against the native binary — proof the extension works in a native
  # image (URL protocols, log handler install, engine boot at RUNTIME_INIT). This is the expensive
  # job (a native build is minutes, not seconds), so it runs once on JDK 25 only, not the full
  # matrix (GraalVM CE community builds only track the latest JDK; the 21 line is frozen at
  # 21.0.2, which is too old for Quarkus 3.38+). Blocking (no continue-on-error): a native
  # regression must turn CI red.
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up GraalVM (native-image)
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Native smoke (hand-rolled, non-Quarkus)
        # The two hand-rolled native paths, each a binary driven from outside against a loopback
        # ntfy server:
        #   * examples/core           — plain ntfy-core, no framework. Run twice, differing only in
        #                               NTFY_LOCALE, because a GraalVM-pruned AlertMessages bundle
        #                               falls back to English in silence.
        #   * examples/logback-zero-code — the Configurator SPI auto-install, with no logback.xml
        #                               anywhere, so what is measured is the service lookup and
        #                               nothing else. Its JVM leg runs in the same invocation as the
        #                               control: a red native leg next to a green JVM one says the
        #                               image is at fault, not the probe.
        # These run BEFORE the Quarkus leg because they are the cheaper images and the ones that can
        # actually fail: the Quarkus extension builds its HttpClient at RUNTIME_INIT, so none of the
        # metadata checked here is on its path. -am adds ntfy-core, ntfy-logback and the example
        # testkit to the reactor.
        run: ./mvnw -q --batch-mode verify -Dnative -pl examples/core,examples/logback-zero-code -am
      - name: Native smoke (Quarkus integration-tests)
        # The deployment module MUST be in the -pl set: the runtime's quarkus-extension-maven-plugin
        # extension-descriptor goal verifies the deployment artifact's dependencies, and that
        # verification only resolves the correct deps when deployment is in the reactor session (in a
        # fresh CI repo it is otherwise unresolvable). -am then adds ntfy-core + ntfy-quarkus-runtime.
        # The native compile + @QuarkusIntegrationTest run against ./…-runner in integration-tests.
        run: ./mvnw -q --batch-mode verify -Dnative -pl ntfy-quarkus/integration-tests,ntfy-quarkus/deployment -am
