# French translation of AlertMessages (example locale). UTF-8.
#
# Adding a language is a pure additive drop of one AlertMessages_xx.properties file with the FULL
# key set below, PLUS a matching entry in
# META-INF/native-image/io.github.pimak/ntfy-core/resource-config.json so GraalVM native builds ship
# the bundle. Rules enforced by AlertMessagesBundleSafetyTest:
#   * Never add a '{' placeholder to a no-placeholder key (labels + fixed status strings).
#   * In the MessageFormat pattern keys, DOUBLE every literal single quote as '' (French needs this
#     for l', d', etc.), and keep the same {0}/{1} argument set as the English base.

# --- Body labels (no placeholders; trailing space preserved) ---
label.message=Message : 
label.logger=Journaliseur : 
label.cause=Causé par : 
label.timestamp=Heure : 

# --- Fixed, credential-safe status/warning strings (no placeholders; single quotes OK) ---
status.disabledUnconfigured=moteur d'alerte ntfy non configuré (url/topic absents) — inactif
status.disabledPartialConfig=url définie mais topic manquant — moteur désactivé
status.tokenAndBasicBothSet=token et nom d'utilisateur/mot de passe configurés — le token est prioritaire
status.incompleteBasicAuth=nom d'utilisateur ou mot de passe défini mais pas les deux — l'authentification basic est incomplète ; publication SANS en-tête Authorization
status.credentialsOverPlainHttp=identifiants configurés avec une URL http:// en clair — le token/mot de passe et le contenu des alertes sont envoyés sans chiffrement ; utilisez https://
status.credentialsOverPlainHttpRefused=identifiants configurés avec une URL http:// en clair et require-https-for-credentials est activé — refus d'envoyer des identifiants non chiffrés ; utilisez https:// — moteur désactivé
status.invalidTopic=le topic n'est pas un nom de topic ntfy valide (autorisés : A-Z, a-z, 0-9, '-', '_' ; max 64 caractères) — moteur désactivé
status.invalidWarnTopic=warn-topic n'est pas un nom de topic ntfy valide (autorisés : A-Z, a-z, 0-9, '-', '_' ; max 64 caractères) — routage WARN désactivé, alertes ERROR inchangées
status.warnTopicFromClasspathRefused=warn-topic provient UNIQUEMENT d'un ntfy.properties du classpath (aucune variable d'environnement NTFY_WARN_TOPIC ni propriété système ntfy.warn-topic) — routage WARN refusé par sécurité de la chaîne d'approvisionnement ; alertes ERROR inchangées. Si ce fichier est le vôtre et que vous lui faites confiance, activez-le avec -Dntfy.allow-classpath-endpoint=true ou NTFY_ALLOW_CLASSPATH_ENDPOINT=true
status.invalidDeliveryPolicyValue=une valeur ntfy cache ou firebase n'a pas pu être lue comme un booléen (attendu : true/false, yes/no, on/off ou 1/0) — ce réglage retombe sur sa valeur par défaut, et notez qu'une valeur illisible dans une couche prioritaire masque aussi toute valeur valide définie en dessous
status.invalidUrl=l'url n'est pas un point de terminaison http(s) valide (attendu http:// ou https:// avec un hôte) — moteur désactivé
status.invalidPriorityOrTags=la valeur priority/tags configurée contient des caractères ASCII non imprimables — l'en-tête invalide sera omis des publications
status.invalidSuppressionWindow=suppressionWindow doit être positif — retour à la valeur par défaut (3 minutes)
status.invalidConnectTimeout=connectTimeout doit être positif — retour à la valeur par défaut (5 secondes)
status.invalidRequestTimeout=requestTimeout doit être positif — retour à la valeur par défaut (10 secondes)
status.invalidAsyncQueueCapacity=asyncQueueCapacity doit être positif — retour au minimum (1)
status.asyncQueueOverflow=la file de distribution asynchrone ntfy est pleine — les alertes abandonnées sont regroupées dans le digest de tempête
publish.unexpectedError=la publication ntfy a échoué de manière inattendue
status.excludedExceptionTypes.unqualified=une entrée de excluded-exception-types ntfy ne porte pas de package — la correspondance se fait sur le nom pleinement qualifié, donc une entrée comme « ClientAbortException » ne correspond jamais à rien ; indiquez aussi le package

# --- Auto-test de démarrage (optionnel ; rien ci-dessous n'est émis quand startup-ping est off) ---
status.startupPing.probePassed=auto-test de démarrage ntfy RÉUSSI (probe) — le serveur a répondu et accepté les identifiants ; attention, une sonde en lecture seule ne prouve pas le droit d'ÉCRITURE : utilisez startup-ping=publish pour vérifier que les alertes sont réellement distribuables
status.startupPing.publishPassed=auto-test de démarrage ntfy RÉUSSI (publish) — une notification de test a été acceptée par le serveur : le point de terminaison, les identifiants et le topic fonctionnent
status.startupPing.failFastRefused=l'auto-test de démarrage ntfy a échoué et startup-ping-fail-fast est activé — refus de démarrer
status.invalidIcon=l'icône ntfy n'est pas une URL d'icône exploitable (attendu : une URL http/https se terminant par .png, .jpg ou .jpeg — ntfy ne gère aucun autre format) — l'icône est ignorée et l'alerting continue sans elle
status.startupPing.failFastWithoutMode=startup-ping-fail-fast est activé mais aucun auto-test n'est configuré — aucune route ne sera testée, le drapeau est donc sans effet ; définissez startup-ping (ou startup-ping-warn) sur probe ou publish
status.startupPing.invalidMode=startup-ping n'est pas un mode reconnu (attendu : off, probe ou publish) — la valeur non reconnue est ignorée
status.startupPing.warnInvalidMode=startup-ping-warn n'est pas un mode reconnu (attendu : off, probe ou publish) — la valeur non reconnue est ignorée
status.startupPing.notifyFailed=l'auto-test de démarrage ntfy n'a pas pu publier non plus sa notification d'échec — les diagnostics ci-dessus sont le seul rapport
selftest.title=auto-test de démarrage ntfy
selftest.failure.title=ÉCHEC de l'auto-test de démarrage ntfy
selftest.body=Auto-test de démarrage de l'intégration de journalisation ntfy. L'alerting est configuré et ce topic est joignable. Aucune action requise.

# --- MessageFormat pattern keys (literal single quotes DOUBLED as '') ---
status.active=moteur d''alerte ntfy ACTIF (url={0}, topic={1})
publish.failed.withStatus=échec de publication ntfy pour le topic ''{0}'' (HTTP {1})
publish.failed.noStatus=échec de publication ntfy pour le topic ''{0}''
status.exclusions.none=moteur d'alerte ntfy : aucun journaliseur exclu configuré
status.exclusions.list=moteur d''alerte ntfy, journaliseurs exclus : {0}
status.includeMdcKeys.list=moteur d''alerte ntfy, clés MDC incluses dans les alertes : {0}
status.warnRoute=moteur d''alerte ntfy : les événements WARN sont routés vers le topic ''{0}''
digest.title={0} — {1} erreurs supprimées
digest.title.warn={0} — {1} avertissements supprimés
digest.body.summary={0} erreurs supprimées au cours des {1}
digest.body.summary.warn={0} avertissements supprimés au cours des {1}
digest.body.loggerLine={0}x {1}
digest.body.overflow=+{0} autres
window.minute={0} minute
window.minutes={0} minutes
window.second={0} seconde
window.seconds={0} secondes
selftest.title.withApp={0} — auto-test de démarrage ntfy
status.startupPing.credentialsRejected=échec de l''auto-test de démarrage ntfy (HTTP {0}) — le serveur a rejeté les identifiants ; le token est peut-être révoqué ou expiré, ou il ne donne pas accès à ce topic
status.startupPing.endpointNotFound=échec de l''auto-test de démarrage ntfy (HTTP {0}) — point de terminaison introuvable ; url doit être l''url de BASE de ntfy SANS le topic, et le topic doit exister
status.startupPing.rateLimited=échec de l''auto-test de démarrage ntfy (HTTP {0}) — le serveur limite le débit de ce client ; la configuration elle-même semble correcte, réessayez plus tard ou augmentez les limites du serveur
status.startupPing.serverError=échec de l''auto-test de démarrage ntfy (HTTP {0}) — le serveur signale une erreur interne ; la configuration elle-même semble correcte, c''est le serveur ntfy qui est en mauvaise santé
status.startupPing.unexpectedStatus=échec de l''auto-test de démarrage ntfy (HTTP {0}) — le serveur a rejeté la requête
status.startupPing.warnRoute=route WARN (topic ''{1}'') — {0}
selftest.failure.title.withApp={0} — ÉCHEC de l''auto-test de démarrage ntfy
selftest.failure.body=Un auto-test de démarrage a échoué pour l''alerting ntfy de cette application. Cette notification est passée par une route qui fonctionne encore : la route nommée ci-dessous est donc celle qui est cassée :\n\n{0}
status.startupPing.unreachable=échec de l''auto-test de démarrage ntfy ({0}) — la requête n''a reçu aucune réponse HTTP ; vérifiez url, le DNS, la confiance TLS/certificat, et tout pare-feu ou proxy de sortie
status.excludedExceptionTypes.list=exceptions exclues ntfy : {0}
