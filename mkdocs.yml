# Built and deployed by .github/workflows/docs.yml. Never invoked by the Maven build.
site_name: ntfy-logging
site_url: https://pimak.github.io/ntfy-logging/
site_description: >-
  ntfy notifications for the JVM: a framework-neutral engine with zero-code adapters for
  java.util.logging, Logback, Log4j2, Spring Boot and Micronaut, a native-ready Quarkus
  extension, and a plain programmatic client.
site_author: pimak
copyright: Apache-2.0

repo_url: https://github.com/Pimak/ntfy-logging
repo_name: Pimak/ntfy-logging
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    # Ties every tab group on the site together by tab label, persisted across pages and visits:
    # pick "Quarkus" once and each tabbed page opens on it. Sync is by exact label, so the labels
    # in configuration.md and observability.md have to stay spelled identically.
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

# Fills the `{{ pin.<property> }}` placeholders in compatibility.md from the root pom.xml, so the
# page reports the versions the build actually pins instead of a hand-copied snapshot of them.
hooks:
  - hooks/compat_pins.py

plugins:
  - search
  - mike:
      # Not the `symlink` default (GitHub Pages serves those unreliably) and not `copy`, which
      # would duplicate the whole Javadoc on every release.
      alias_type: redirect
      canonical_version: latest

extra:
  version:
    provider: mike
    default: latest

# Generated by the `docs-site` Maven profile, copied verbatim, kept out of the nav.
not_in_nav: |
  apidocs/**

# Each of these becomes an ERROR under --strict, which is what makes the PR job a real gate.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Required for Material's icon shortcodes; without it they render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  # Inlines the real files from examples/; check_paths fails the build when one moves, so a page
  # can never show an example that no longer exists.
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true

nav:
  - Home: index.md
  - Guides:
      - Spring Boot: spring-boot.md
      - Quarkus: quarkus.md
      - Micronaut: micronaut.md
      - Plain Logback: logback.md
      - Plain Log4j2: log4j2.md
      - java.util.logging: jul.md
      - Core (any JVM app): core.md
  - Reference:
      - Configuration: configuration.md
      - Alert behavior: alert-behavior.md
      - Level routing: level-routing.md
      - Filtering: filtering.md
      - MDC context: mdc-context.md
      - Authentication: authentication.md
      - Observability: observability.md
      - Troubleshooting: troubleshooting.md
      - BOM: bom.md
      - Compatibility: compatibility.md
