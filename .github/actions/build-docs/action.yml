name: Build the documentation site
description: >-
  Installs the MkDocs toolchain and generates the aggregated Javadoc into docs/apidocs, leaving the
  working tree ready for `mkdocs build` or `mike deploy`. Every job in docs.yml goes through this
  action, so the build recipe exists exactly once.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: requirements-docs.txt

    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        # JDK 21 like release.yml: JDK 25's doclint is stricter than what the artifacts target.
        java-version: '21'
        cache: maven

    - name: Install the MkDocs toolchain
      shell: bash
      run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

    - name: Generate the aggregated Javadoc
      shell: bash
      run: ./mvnw --batch-mode -P docs-site -DskipTests javadoc:aggregate

    # javadoc:aggregate has no output-directory parameter, so it is staged after the fact.
    - name: Stage the Javadoc into the MkDocs tree
      shell: bash
      run: |
        set -euo pipefail
        test -f target/reports/apidocs/index.html
        rm -rf docs/apidocs
        cp -r target/reports/apidocs docs/apidocs
        echo "Staged $(find docs/apidocs -type f | wc -l) Javadoc files into docs/apidocs"
