# Loaded only when the "ntfybinding" environment is active, so it cannot leak into the other
# tests' contexts. Mirrors the ntfy.* block an application.yml would carry, in kebab-case.
# enabled=false keeps this fixture from installing an appender on the JVM-wide root logger; the
# endpoint is a closed loopback port for the same reason.
ntfy.url=https://127.0.0.1:1
ntfy.topic=file-topic
ntfy.app-name=from-config-file
ntfy.connect-timeout=3s
ntfy.suppression-window=90s
ntfy.max-stack-frames=12
ntfy.warn-topic=file-warn-topic
ntfy.async=false
ntfy.enabled=false
