name: Compatibility sweep

# Re-verifies the version ranges docs/compatibility.md reports as **Verified**. Those rows are
# single measurements: each was run once, by hand, and nothing re-runs them — so a change here, or a
# republished upstream artifact, could quietly falsify the page. This job is what keeps them honest.
#
# Deliberately NOT part of the CI workflow and NOT a required check: it can go red for reasons that
# have nothing to do with the pull request in front of you, and a blocking job that behaves that way
# trains people to ignore it. It runs weekly instead, and reports failures as an issue — a scheduled
# job that fails silently in the Actions tab is a job nobody reads.

on:
  schedule:
    # Mondays 04:17 UTC. Off the hour on purpose: :00 is when everyone else's cron fires and the
    # hosted runner queue is at its worst.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-sweep
  cancel-in-progress: false

jobs:
  # Turns .github/compat-versions.tsv into the job matrix below. Keeping the list in that file rather
  # than inline here is what lets CompatibilityMatrixGuardTest hold the docs and this sweep to the
  # same set of versions.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.read.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        name: Read the version list
        run: |
          set -euo pipefail
          # An explicit existence check, because the guard below cannot tell "the file is gone" from
          # "the file says nothing" — and with a fourth column now required, a row list that fails to
          # parse is a likelier mistake than it was.
          if [ ! -f .github/compat-versions.tsv ]; then
            echo "::error::.github/compat-versions.tsv is missing"
            exit 1
          fi
          # `|| true` because grep exits 1 on a file that is all comments and blank lines. That is a
          # state this step reports on in its own words below, not a pipeline error to die on.
          combos=$(grep -vE '^[[:space:]]*(#|$)' .github/compat-versions.tsv \
            | awk '{printf "%s{\"module\":\"%s\",\"property\":\"%s\",\"version\":\"%s\",\"jdk\":\"%s\"}", (NR>1 ? "," : ""), $1, $2, $3, $4}' || true)
          if [ -z "$combos" ]; then
            echo "::error::.github/compat-versions.tsv yielded no combinations"
            exit 1
          fi
          echo "combos=[$combos]" >> "$GITHUB_OUTPUT"

  sweep:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every combination must report independently: one broken version should not hide the others,
      # and the issue below is far more useful when it names all of them.
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.matrix.outputs.combos) }}
    name: ${{ matrix.combo.property }}=${{ matrix.combo.version }} (JDK ${{ matrix.combo.jdk }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # From the row's fourth column, not a workflow-wide constant: Micronaut 5 ships Java 25
          # bytecode in its annotation processor and cannot be built on 21, while the 4.x rows are
          # run on 21 on purpose, to keep proving the project's own baseline still holds.
          java-version: ${{ matrix.combo.jdk }}
          cache: maven
      - name: Test against the overridden version
        # -am is REQUIRED, not an optimization: without it the module resolves its ntfy-* siblings
        # from the local repository, which on a fresh runner means the last PUBLISHED release rather
        # than this working tree — so the sweep would silently test old code.
        run: >
          ./mvnw --batch-mode clean test
          -pl ${{ matrix.combo.module }} -am
          -D${{ matrix.combo.property }}=${{ matrix.combo.version }}

  # Guards a claim the sweep above cannot make: that the artifact this project PUBLISHES — compiled
  # by the Micronaut 4 annotation processor — still runs on Micronaut 5. Every sweep leg recompiles
  # from source, so a green there says "our sources build against 5.x", which is a different and much
  # weaker statement. Consumers get the jar, not the sources.
  #
  # Measured 2026-08-22: the four generated $…$Definition classes are Java 17 bytecode extending
  # AbstractInitializableBeanDefinitionAndReference, and micronaut-inject 5.x loads them unchanged.
  # Micronaut publishes no promise about that, which is exactly why it needs a job watching it rather
  # than a sentence in the docs.
  #
  # Runs against whatever 5.x is current rather than a pinned version: the risk being watched is a
  # FUTURE 5.x dropping support for definitions the 4.x processor emits. A pin would stay green
  # forever while the thing it guards quietly stopped being true.
  forward-compat:
    name: micronaut 4-built artifact on latest Micronaut 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          # 25, not the project baseline: a JDK 21 runtime cannot load Micronaut 5 at all.
          java-version: '25'
          cache: maven

      - name: Resolve the latest Micronaut 5 release
        id: latest
        run: |
          set -euo pipefail
          # Release versions only — the </version> tag immediately after the third digit group is
          # what rejects 5.0.0-M1 and 5.0.0-RC1, which must never gate a scheduled job.
          url=https://repo1.maven.org/maven2/io/micronaut/platform/micronaut-platform/maven-metadata.xml
          version=$(curl -sSf --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 60 "$url" \
            | grep -oE '<version>5\.[0-9]+\.[0-9]+</version>' \
            | sed -E 's|</?version>||g' \
            | sort -V \
            | tail -1)
          if [ -z "$version" ]; then
            echo "::error::no Micronaut 5.x release found in Central metadata"
            exit 1
          fi
          echo "Latest Micronaut 5: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the module the way a release builds it — against Micronaut 4
        # No -Dmicronaut.version here, deliberately: this step must use the pinned 4.x line, so that
        # the annotation processor writing the bean definitions is the 4.x one.
        run: |
          set -euo pipefail
          ./mvnw --batch-mode clean install -pl ntfy-core,ntfy-logback -DskipTests
          ./mvnw --batch-mode package -pl ntfy-micronaut -DskipTests

      - name: Fingerprint the generated bean definitions
        # The whole experiment rests on these classes NOT being rebuilt by the next step. Hashing
        # them before and after is what turns "the tests passed" into "the tests passed against
        # definitions the 4.x processor wrote".
        #
        # The hash discriminates, which is the part worth checking: measured 2026-08-22, the 5.x
        # processor emits different bytes for all four definitions, so a run that recompiled would
        # be caught rather than sliding through on a coincidence.
        run: |
          set -euo pipefail
          find ntfy-micronaut/target/classes -name '*$Definition.class' | sort > /tmp/defs.txt
          if [ ! -s /tmp/defs.txt ]; then
            echo "::error::no generated bean definitions found — the 4.x build never ran the processor"
            exit 1
          fi
          xargs md5sum < /tmp/defs.txt | tee /tmp/defs-before.txt

      - name: Run the suite against Micronaut ${{ steps.latest.outputs.version }}
        # -Dmaven.main.skip=true is the load-bearing flag: it leaves target/classes exactly as the
        # step above left it, so only the test classpath moves to 5.x. Note the absence of `clean`.
        #
        # It is maven-compiler-plugin's own skipMain parameter, so no pom declares it and grepping
        # the poms for it finds nothing — it is settable from the command line all the same, and the
        # build prints "Not compiling main sources" when it takes effect. Do not remove it as dead
        # configuration: without it this step recompiles main against 5.x as soon as the sources are
        # newer than target/classes, and the job then measures the wrong thing.
        run: >
          ./mvnw --batch-mode test -pl ntfy-micronaut
          -Dmicronaut.version=${{ steps.latest.outputs.version }}
          -Dmaven.main.skip=true

      - name: Prove the run actually proved something
        # Three ways this job could go green while testing nothing, each checked rather than assumed:
        # the main classes were quietly recompiled against 5.x; the version override never reached
        # the classpath; or no test ran at all.
        run: |
          set -euo pipefail

          xargs md5sum < /tmp/defs.txt > /tmp/defs-after.txt
          if ! diff -u /tmp/defs-before.txt /tmp/defs-after.txt; then
            echo "::error::the generated bean definitions changed — main was recompiled, so this run says nothing about forward compatibility"
            exit 1
          fi

          ./mvnw --batch-mode dependency:build-classpath -pl ntfy-micronaut \
            -Dmicronaut.version=${{ steps.latest.outputs.version }} \
            -Dmdep.outputFile=/tmp/cp.txt -q
          if ! grep -qE 'micronaut-inject[/-]5\.' /tmp/cp.txt; then
            echo "::error::micronaut-inject 5.x is not on the test classpath — the version override did not take effect"
            exit 1
          fi

          # The file check comes first and stands alone: under `set -o pipefail` an unmatched glob
          # would hand the literal pattern to grep and kill the step with "No such file or
          # directory" — a generic error in place of the specific one this check exists to give.
          if ! ls ntfy-micronaut/target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::no surefire report was written — the suite never ran"
            exit 1
          fi
          # sed rather than grep for the same reason: it exits 0 on no match, so a report carrying
          # no tests= attribute reports zero here instead of failing the pipeline upstream of the
          # message that would have explained it.
          total=$(cat ntfy-micronaut/target/surefire-reports/TEST-*.xml \
            | tr ' ' '\n' \
            | sed -n 's/^tests="\([0-9]*\)"$/\1/p' \
            | awk '{s+=$1} END {print s+0}')
          echo "tests executed: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::surefire reports exist but account for no tests"
            exit 1
          fi

  report:
    needs: [sweep, forward-compat]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # One issue, commented on rather than duplicated: a weekly job that files a fresh issue every
        # Monday is a job whose issues get muted. Matched by exact title rather than by label, so the
        # workflow does not depend on a label existing in the repository — `gh issue create --label`
        # fails outright on an unknown label, which would turn a real finding into a silent no-op.
        run: |
          set -euo pipefail
          title='Compatibility sweep is failing'
          body=$(printf '%s\n' \
            'The weekly compatibility sweep failed. Either a version that `docs/compatibility.md`' \
            "reports as **Verified** no longer passes its module's test suite, or the" \
            '`forward-compat` job failed — meaning the published Micronaut 4-built jar no longer runs' \
            'on the latest Micronaut 5, which that page also claims.' \
            '' \
            "Run: $RUN_URL" \
            '' \
            'Each matrix leg is named `<property>=<version>`, so the failing legs name the versions' \
            'directly. Either fix the incompatibility, or drop the version from' \
            '`.github/compat-versions.tsv` **and** its row in `docs/compatibility.md` —' \
            '`CompatibilityMatrixGuardTest` fails until those two agree.')

          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
