# Automated dependency updates: Maven dependencies/plugins (incl. the Quarkus and Spring Boot
# BOM patch levels), the SHA-pinned GitHub Actions in ci.yml / release.yml / docs.yml, and the
# pinned MkDocs toolchain in requirements-docs.txt.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Micronaut 5 requires Java 25 bytecode; keep the Java 21 compatibility leg
      # until the baseline is deliberately raised in a separate change.
      - dependency-name: "io.micronaut.platform:micronaut-platform"
        versions: [">= 5.0.0"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze are two paths inside one repository, and CodeQL refuses to run a mix of
      # versions ("Loaded a configuration file for version X, but running version Y"). Ungrouped,
      # Dependabot bumps each in its own PR, so neither can go green on its own and both stay red
      # until the other merges. Grouping puts the pair in a single PR that moves them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # requirements-docs.txt — mkdocs-material and mike, pinned so site builds are reproducible.
  # Kept out of the Maven ecosystem entry above: it is documentation tooling, not a build input.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
