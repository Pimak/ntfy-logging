wrapperVersion=3.3.4
distributionType=only-script
# One Maven line for the whole project: the build, CI, the compatibility sweep and the release
# deploy all run this wrapper. It is deliberately 3.9.x and not the 4.x line —
# central-publishing-maven-plugin (0.11.0, its latest) does not upload under Maven 4: on `deploy`
# it stages the bundle to the local repository and its session upload hook never fires, so the
# build goes green without publishing anything (this bit 0.1.0/0.1.1). Until that is fixed and
# Maven 4 is GA, building on a line the release cannot use only hides breakage until tag time.
# On bump: recompute distributionSha256Sum from the artifact whose published SHA-512 you verified.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce
